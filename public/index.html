<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación Documental — SYS Ingeniería SpA</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<style>
  /* ===== RAÍZ Y RESET ===== */
  :root{
    --azul:#1668b3;
    --texto:#000;
    --primary-00:#0f69b4;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#fff;
    color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ===== CONTAINER (Bootstrap 5 responsive) ===== */
  .container{
    width:100%;
    padding-left:12px;
    padding-right:12px;
    margin:0 auto;
  }
  @media(min-width:540px){.container{max-width:540px}}
  @media(min-width:720px){.container{max-width:720px}}
  @media(min-width:960px){.container{max-width:960px}}
  @media(min-width:1140px){.container{max-width:1140px}}
  @media(min-width:1320px){.container{max-width:1320px}}

  /* ===== HOJA / MODAL ===== */
  .hoja{
    max-width:780px; /* referencia original */
    margin:0 auto;
    padding:24px 20px 60px;
  }

  /* ===== MODAL BOX ===== */
  .modalContainer{
    display:flex;
    flex-direction:column;
    align-items:center;
    align-self:stretch;
    padding:8px 0;
  }

  /* ===== LOGO DT ===== */
  .logo{
    width:56px; height:56px;
    margin:4px 0 0 40px;
    display:flex; align-items:center; justify-content:center;
  }
  .logo img.dt-logo{width:auto; height:auto; max-width:40px; max-height:40px; display:block}

  /* ===== TERMINOS / CONTENIDO ===== */
  .terminosContainer{
    display:flex; flex-direction:column; align-items:flex-start;
    padding:16px;
    gap:24px;
    margin-left:35px;
  }
  h1.titulo-doc{
    font-family:"Times New Roman",Times,Georgia,serif;
    font-size:22px; font-weight:700; margin:0 0 22px; color:#000;
  }
  .dato{
    font-family:"Times New Roman",Times,Georgia,serif;
    font-size:19px; line-height:1.5; margin:0 0 26px;
  }
  .dato.negrita{font-weight:700}
  .dato .serie-num{font-family:monospace; letter-spacing:0.03em;}

  /* ===== LOGO CONTAINER (sello / verified) ===== */
  .logoContainer{
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:8px; padding:8px 0; align-self:stretch;
    text-align:center;
  }
  .logoContainer img{width:120px; height:auto; display:block}

  /* ===== FOOTER CONTAINER ===== */
  .footerContainer{
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    gap:30px; padding-top:10px; align-self:stretch;
  }

  /* ===== BOTONES ===== */
  .boton{
    -webkit-font-smoothing:antialiased;
    box-sizing:border-box; outline:none; position:relative;
    font-weight:400; white-space:nowrap; text-align:center;
    background-image:none; border:1px solid transparent; cursor:pointer;
    transition:all 0.2s cubic-bezier(0.645,0.045,0.355,1);
    user-select:none; touch-action:manipulation;
    text-decoration:none; /* <a> base */
    /* Box model del botón (referencia ant-btn) */
    display:inline-flex; gap:8px; align-items:center; justify-content:center;
    height:43px; min-height:42px; min-width:256px;
    padding:8px 20px; border-radius:4px; font-size:16px;
  }
  .boton.aceptarButton{
    background:#0f69b4; color:#fff; border-color:#1677ff;
  }
  .boton.aceptarButton:hover{background:#0958d9}
  .boton.cerrarButton{
    background:transparent; color:#0f69b4; border:1px solid #0f69b4;
  }
  .boton.cerrarButton:hover{background:#e6f4ff}

  /* ===== RESPUESTA ===== */
  @media(max-width:540px){
    .terminosContainer{margin-left:0; padding:12px; gap:16px}
    .logo{margin:4px 0 0 0}
    .boton{width:100%; max-width:287px; min-width:100%}
  }
</style>
</head>
<body>
<div class="container">
  <div class="hoja">
    <div class="modalContainer">
      <div class="logo"><img class="dt-logo" src="logo-dt.png" alt="logo-modal"></div>
      <div class="terminosContainer">
        <h1 class="titulo-doc">Certificado Antecedentes Laborales Previsionales</h1>
        <p class="dato">N° Serie Documental <span class="serie-num">RGQAGGEWOBJQ</span></p>
        <p class="dato">SYS INGENIERÍA SPA</p>
        <p class="dato negrita">Fecha de Emisión 31/08/2026</p>
      </div>
      <div class="logoContainer">
        <img src="verified.svg" alt="Verificado" width="120">
      </div>
      <div class="footerContainer">
        <a class="boton aceptarButton" href="pdfs/JlrwqDz9yZ3cmRFfU5TWxA4o3muYYR8a2OrEeuQkahZ.pdf" download="certificado-antecedentes.pdf">Descargar Certificado</a>
        <a class="boton cerrarButton" href="https://midt.dirtrab.cl/verificadorDocumental">Verificar Otro</a>
        <img src="footer.svg" alt="Footer" style="display:block; margin-top:20px;">
      </div>
    </div>
  </div>
</div>
</body>
</html>
