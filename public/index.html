<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <title>VERIFICADOR DOCUMENTO</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: "Times New Roman", serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 0;
    }

    /* Contenedor raíz (referencia: modalContainer) */
    .modalContainer {
      width: 100%;
      max-width: 680px;
    }

    /* Caja blanca centrada con textos izquierda (referencia: container) */
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      color: #000;
      text-align: left;
    }

    .row {
      display: flex;
      align-items: flex-start;
      width: 100%;
    }

    .dt-logo {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 10px rgba(255, 255, 255, .12);
      object-fit: cover;
      flex-shrink: 0;
    }

    .terminosContainer {
      align-items: flex-start;
      display: flex;
      flex-direction: column;
      font-family: "Times New Roman", serif;
      font-size: 14pt;
      gap: 24px;
      margin-left: 35px;
      padding: 16px;
    }

    h1 {
      font-family: "Times New Roman", serif;
      font-size: 15pt;
      font-weight: 700;
    }

    .doc-line {
      font-size: 14pt;
      text-align: left;
      color: #000;
      margin: 18px 0;
      line-height: 1.4;
    }

    /* Contenedor del check (referencia: logoContainer) */
    .logoContainer {
      margin: 32px 0 28px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logoContainer img {
      width: 100px;
      height: auto;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: 8px 0 36px;
    }

    .btn-purple {
      display: inline-block;
      width: 280px;
      max-width: 90%;
      padding: 12px 20px;
      border: 2px solid #7c3aed;
      color: #7c3aed;
      font-family: "Times New Roman", serif;
      font-size: 1.05rem;
      text-decoration: none;
      border-radius: 8px;
      letter-spacing: .04em;
      text-align: center;
      transition: background .15s, color .15s;
    }

    .btn-purple:hover {
      background: #7c3aed;
      color: #fff;
    }

    /* Footer (referencia: footerContainer + div class="row") */
    .footerContainer {
      width: 100%;
      max-width: 680px;
      margin-top: auto;
    }

    .footerContainer .row {
      height: 150px;
      background: #0a2540;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .footerContainer .row img {
      width: 380px;
      max-width: 100%;
      height: auto;
      opacity: .95;
    }
  </style>
</head>
<body>
  <div class="modalContainer">
    <div class="container">
      <div class="row">
        <img class="dt-logo" src="logo-dt.png" alt="DT"/>
        <div class="terminosContainer">
          <h1>Certificado Antecedentes Laborales Previsionales</h1>
          <div class="doc-line">N° Serie Documental RGQAGGEWOBJQ</div>
          <div class="doc-line">SYS INGENIERÍA SPA</div>
          <div class="doc-line">Fecha de Emisión 31/08/2026</div>
        </div>
      </div>

      <div class="logoContainer">
        <img src="verified.svg" alt="Verificado"/>
      </div>

      <div class="btn-wrap">
        <a class="btn-purple" href="/api/serve.js?token=JlrwqDz9yZ3cmRFfU5TWxA4o3muYYR8a2OrEeuQkahZ&download=1" target="_blank">Descargar Certificado</a>
        <a class="btn-purple" href="/?t=reset">Verificar Otro</a>
      </div>
    </div>

    <div class="footerContainer">
      <div class="row">
        <img src="footer.svg" alt="Footer"/>
      </div>
    </div>
  </div>
</body>
</html>
