<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>

<title>VERIFICADOR DOCUMENTO</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Georgia,"Times New Roman",serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;padding:36px 24px}
.container{max-width:640px;margin:0 auto;padding-top:10px}
.logo-area{display:flex;align-items:center;gap:12px;padding-left:0;margin-bottom:20px}
.logo-area img{width:72px;height:auto;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(255,255,255,.12)}
h1{font-size:2rem;font-weight:700;color:#fff;margin:10px 0 10px;letter-spacing:.01em;font-family:Georgia,serif;line-height:1.15}
.doc-line{font-size:1.35rem;color:#fff;font-family:Georgia,serif;margin:14px 0;padding:4px 0}
.check{margin:24px 0 22px;display:flex;justify-content:center;align-items:center;gap:10px}
.check img{width:110px;height:auto}
.btn-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:10px 0 32px}
.btn-purple{display:inline-block;padding:14px 28px;border:2px solid #7c3aed;color:#7c3aed;font-family:Georgia,serif;font-size:1.15rem;text-decoration:none;border-radius:10px;letter-spacing:.05em;transition:background .15s, color .15s}
.btn-purple:hover{background:#7c3aed;color:#fff}
.footer-strip{width:100%;max-width:640px;height:110px;background:#0a2540;margin-top:auto;display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden}
.footer-strip img{max-height:60px;opacity:.9}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area"><img src="logo-dt.png" alt="DT"/><span style="font-family:Georgia,serif;font-size:1.6rem;color:#f8fafc;font-weight:700">DT</span></div>

  <h1>Certificado Antecedentes Laborales Previsionales</h1>

  <div class="doc-line">N° Serie Documental RGQAGGEWOBJQ</div>
  <div class="doc-line">SYS INGENIERÍA SPA</div>
  <div class="doc-line">Fecha de Emisión 31/08/2026</div>

  <div class="check"><img src="verified.svg" alt="Verificado"/></div>

  <div class="btn-wrap">
    <a class="btn-purple" href="/api/serve.js?token=JlrwqDz9yZ3cmRFfU5TWxA4o3muYYR8a2OrEeuQkahZ&download=1" target="_blank">Descargar Certificado</a>
