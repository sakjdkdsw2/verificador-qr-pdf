<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación Documental — SYS Ingeniería SpA</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<style>
  :root{
    --azul:#1668b3;
    --verde:#5cb85c;
    --texto:#000;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#fff;
    color:var(--texto);
    font-family:"Times New Roman", Times, Georgia, serif;
    min-height:100vh;
  }

  .hoja{
    max-width:780px;
    margin:0 auto;
    padding:24px 20px 60px;
  }

  /* Logo DT (izquierda, sin border-radius) */
  .logo{
    width:56px;
    height:56px;
    margin:4px 0 0 40px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo img{
    width:36px; height:36px; display:block; object-fit:contain;
  }

  .contenido{
    margin-top:24px;
    padding-left:60px;
  }

  /* Título documento */
  h1.titulo-doc{
    font-family:"Times New Roman", Times, Georgia, serif;
    font-size:22px;
    font-weight:700;
    margin:0 0 22px;
    color:#000;
  }

  .dato{
    font-size:19px;
    line-height:1.5;
    margin:0 0 26px;
  }
  .dato.negrita{font-weight:700}

  .centro{
    text-align:center;
    padding-right:60px;
  }

  /* Sello / check centrado */
  .logoContainer{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:22px auto 40px;
  }
  .logoContainer img{
    width:120px;
    height:auto;
    display:block;
  }

  /* Botones (estilo ant-btn anterior) */
  .boton{
    -webkit-font-smoothing:antialiased;
    box-sizing:border-box;
    outline:none;
    position:relative;
    font-weight:400;
    white-space:nowrap;
    text-align:center;
    background-image:none;
    background:transparent;
    border:1px solid transparent;
    cursor:pointer;
    transition:all 0.2s cubic-bezier(0.645,0.045,0.355,1);
    user-select:none;
    touch-action:manipulation;
    box-shadow:0 2px 0 rgba(0,0,0,0.02);
    border-color:#d9d9d9;
    align-items:center;
    border-radius:4px;
    display:flex;
    font-family:Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    gap:8px;
    height:43px;
    justify-content:center;
    min-height:42px;
    min-width:256px;
    padding:8px 20px;
    color:#fff;
    width:287px;
    margin:0 auto 12px;
  }
  .boton.azul{background:var(--primary-00,#0f69b4)}
  .boton.azul:hover{background:#0a4e8a}
  .boton.outline{
    background:transparent;
    border:1px solid #d9d9d9;
    color:rgba(0,0,0,0.88);
  }
  .boton.outline:hover{background:rgba(0,0,0,0.04)}

  .campo{
    display:block;
    width:287px;
    height:44px;
    margin:0 auto;
    padding:0 10px;
    border:1px solid var(--azul);
    border-radius:3px;
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
    outline:none;
  }
  .campo:focus{box-shadow:0 0 0 2px rgba(22,104,179,.25)}

  @media(max-width:640px){
    .contenido{padding-left:0;margin-top:24px}
    .centro{padding-right:0}
    .logo{margin-left:0}
    .boton,.campo{width:100%;max-width:287px}
  }
</style>
</head>
<body>
<div class="hoja">
  <div class="logo"><img src="logo-dt.png" alt="logo-modal"></div>
  <div class="contenido">
    <h1 class="titulo-doc">Certificado Antecedentes Laborales Previsionales</h1>
    <p class="dato">N° Serie Documental RGQAGGEWOBJQ</p>
    <p class="dato">SYS INGENIERÍA SPA</p>
    <p class="dato negrita">Fecha de Emisión 31/08/2026</p>
    <div class="centro">
      <div class="logoContainer"><img src="verified.svg" alt="Verificado"></div>
      <button class="boton azul aceptarButton" type="button">Descargar Certificado</button>
      <button class="boton outline cerrarButton" type="button">Verificar Otro</button>
      <img src="footer.svg" alt="Footer" style="display:block;margin:40px auto 0;">
    </div>
  </div>
</div>
</body>
</html>
