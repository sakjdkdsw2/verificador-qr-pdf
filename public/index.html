<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <title>VERIFICADOR DOCUMENTO</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: "Times New Roman", serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 0;
    }

    /* Contenedor raíz (referencia: modalContainer) */
    .modalContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      align-self: stretch;
      padding: 8px 0;
    }

    /* Caja blanca centrada con textos izquierda (referencia: container) */
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      color: #000;
      text-align: left;
    }

    .row {
      display: flex;
      align-items: flex-start;
      width: 100%;
    }

    .dt-logo {
      width: 36px;
      height: 36px;
      position: relative;
      max-width: 50px;
      max-height: 50px;
      flex-shrink: 0;
      display: block;
      object-fit: contain;
    }

    .terminosContainer {
      align-items: flex-start;
      display: flex;
      flex-direction: column;
      font-family: "Times New Roman", serif;
      font-size: 20px;
      gap: 24px;
      margin-left: 35px;
      padding: 16px;
    }

    .aceptarButton, .cerrarButton {
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      outline: none;
      position: relative;
      font-weight: 400;
      white-space: nowrap;
      text-align: center;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 2px 0 rgba(0,0,0,0.02);
      border-color: #d9d9d9;
      align-items: center;
      border-radius: 4px;
      display: flex;
      font-family: Roboto;
      font-size: 16px;
      gap: 8px;
      height: 43px;
      justify-content: center;
      min-height: 42px;
      min-width: 256px;
      padding: 8px 20px;
      background: var(--primary-00,#0f69b4);
      color: #fff;
    }

    h1 {
      font-family: "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
      margin-left: 30px;
    }


    /* Contenedor del check (referencia: logoContainer) */
    .logoContainer {
      margin: 32px 0 28px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      width: 100%;
    }

    .logoContainer img {
      width: 50px;
      height: 50px;
      display: block;
      object-fit: contain;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: 8px 0 36px;
    }

    .btn-purple {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 256px;
      height: 43px;
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      background: #0f69b4;
      color: #fff;
      font-family: "Times New Roman", serif;
      font-size: 16px;
      text-decoration: none;
      text-align: center;
      transition: background .15s, color .15s;
      box-sizing: border-box;
    }

    .btn-purple:hover {
      background: #0a4e8a;
      color: #fff;
    }

    /* Footer (referencia: footerContainer + div class="row") */
    .footerContainer {
      width: 100%;
      max-width: 680px;
      margin-top: auto;
    }

    .footerContainer .row {
      height: 150px;
      background: #0a2540;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .footerContainer .row img {
      width: 380px;
      max-width: 100%;
      height: auto;
      opacity: .95;
    }
  </style>
</head>
<body>
  <div class="modalContainer container">
      <div class="logoContainer"><img src="dt-logo.png" alt="logo-modal" width="120" class="dt-logo"></div>
      <div class="row">
        <div class="terminosContainer">
          <h1>Certificado Antecedentes Laborales Previsionales</h1>
          <div> N° Serie Documental RGQAGGEWOBJQ</div>
          <div>SYS INGENIERÍA SPA</div>
          <div><strong>Fecha de Emisión 31/08/2026</strong></div>
        </div>
      </div>

      <div class="logoContainer">
        <img src="verified.svg" alt="Verificado"/>
      </div>

      <div class="btn-wrap">
        <button type="button" class="ant-btn css-mncuj7 ant-btn-default ant-btn-color-default ant-btn-variant-outlined aceptarButton"><span>Descargar Certificado</span></button>
        <button type="button" class="ant-btn css-mncuj7 ant-btn-default ant-btn-color-default ant-btn-variant-outlined cerrarButton"><span>Verificar Otro</span></button>
      </div>
    </div>

    <div class="footerContainer">
      <div class="row">
        <img src="footer.svg" alt="Footer"/>
      </div>
    </div>
  </div>
</body>
</html>
