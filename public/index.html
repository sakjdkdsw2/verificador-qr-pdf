<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERIFICADOR DOCUMENTO</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      background: #fff;
      /* Fuente exacta del CSS original de la DT */
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
    }

    .content {
      width: 100%;
      max-width: 520px;
      padding: 0 16px;
    }

    .logo-wrap {
      margin-bottom: 16px;
      margin-left: -40px;   /* un poco más a la izquierda */
    }
    .logo-wrap img {
      width: 48px;
      height: 48px;
      display: block;
    }

    /* TÍTULO - igual que original */
    .titulo {
      text-align: center;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 34px 0;
      line-height: 1.35;
      white-space: nowrap;
      color: #000;
      letter-spacing: -0.01em;
    }

    /* DATOS */
    .datos {
      text-align: left;
      margin-bottom: 36px;
    }
    .datos p {
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      margin: 0 0 18px 0;
      line-height: 1.5;
      text-align: left;
      color: #000;
      letter-spacing: 0.01em;
    }
    .datos p:last-child {
      margin-bottom: 0;
    }

    /* SYS INGENIERÍA SPA - sin negrita */
    .datos .empresa {
      font-weight: 400;
    }

    /* Fecha de Emisión - con negrita */
    .datos .fecha {
      font-weight: 700;
    }

    .sello-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
    }
    .sello-wrap svg {
      width: 80px;
      height: 80px;
    }

    .botones {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 256px;
      height: 40px;
      border-radius: 4px;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-azul {
      background: #0f69b4;
      color: #fff;
      border: none;
    }
    .btn-azul:hover { background: #0d5c9e; }
    .btn-borde {
      background: transparent;
      color: #0f69b4;
      border: 1px solid #0f69b4;
    }
    .btn-borde:hover { background: rgba(15,105,180,0.05); }

    .footer {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .footer svg {
      width: 360px;
      max-width: 90vw;
      height: auto;
      display: block;
    }

    @media (max-width: 480px) {
      .titulo {
        white-space: normal;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="content">

      <div class="logo-wrap">
        <src="logo-dt.png" alt="logo-modal" style="width:48px;height:48px;display:block;"
      </div>

      <h1 class="titulo">Certificado Antecedentes Laborales Previsionales</h1>

      <div class="datos">
        <p>N° Serie Documental RGQAGGEWOBJQ</p>
        <p class="empresa">SYS INGENIERÍA SPA</p>
        <p class="fecha">Fecha de Emisión 31/08/2026</p>
      </div>

      <div class="sello-wrap">
      <img src="verified.svg" alt="Verificado" style="width:80px;height:80px;display:block;">
    </div><div class="botones">
        <a href="pdfs/JlrwqDz9yZ3cmRFfU5TWxA4o3muYYR8a2OrEeuQkahZ.pdf" download="certificado-antecedentes.pdf" class="btn btn-azul">Descargar Certificado</a>
        <a href="https://midt.dirtrab.cl/verificadorDocumental" class="btn btn-borde">Verificar Otro</a>
      </div>

    </div>

    <div class="footer">
      <img src="footer.svg" alt="Footer" style="width:360px;max-width:90vw;height:auto;display:block;">
    </div></body>
</html>
