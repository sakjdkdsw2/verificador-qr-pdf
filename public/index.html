<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERIFICADOR DOCUMENTO</title>
  <link rel="icon" type="image/png" href="favicon-16x16.png" />
  <style>
    :root {
      --primary-00: #0f69b4;
      --character-primary-65: rgba(0, 0, 0, 0.65);
      --texto: #000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif; background: #fff; color: var(--texto); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    /* .page equivalente al contenedor general */
    .page { width: 100%; max-width: 520px; padding: 0 16px; display: flex; flex-direction: column; align-items: center; }
    /* .content equivalente a .content (max-width 520) */
    .content-wrapper { width: 100%; max-width: 520px; padding: 0 16px; }
    .logoContainer { display: flex; padding: 8px 0px; flex-direction: column; align-items: center; gap: 8px; align-self: stretch; }
    .logoContainer img { width: 48px; height: 48px; display: block; }
    /* Título como referencia (20px en stylesQR); la referencia HTML usaba 17px, mantenemos referencia HTML */
    .tituloContainer { display: flex; flex-direction: column; justify-content: center; width: 100%; margin-left: 30px; }
    .tituloContainer h1 { font-family: 'Roboto'; font-size: 20px; margin-left: 30px; font-weight: 700; }
    /* Datos (serie, empresa, fecha) */
    .datos { text-align: left; margin-bottom: 36px; }
    .datos p { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14.5px; font-weight: 400; margin: 0 0 18px 0; line-height: 1.5; text-align: left; color: #000; letter-spacing: 0.01em; }
    .datos p:last-child { margin-bottom: 0; }
    .datos .empresa { font-weight: 400; }
    .datos .fecha { font-weight: 700; }
    /* Sello (verified.svg) */
    .sello-wrap { display: flex; justify-content: center; margin-bottom: 36px; }
    .sello-wrap img { width: 80px; height: 80px; display: block; }
    /* Botones — iguales a stylesQR */
    .botones { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 40px; }
    .btn { display: flex; align-items: center; justify-content: center; width: 256px; height: 43px; border-radius: 4px; font-family: 'Roboto'; font-size: 16px; font-weight: 400; text-decoration: none; cursor: pointer; min-width: 256px; min-height: 42px; padding: 8px 20px; gap: 8px; }
    .aceptarButton { background: var(--primary-00, #0f69b4); color: #fff; border: none; }
    .aceptarButton:hover { background: #0d5c9e; }
    .cerrarButton { background: transparent; color: var(--primary-00, #0f69b4); border: 1px solid var(--primary-00, #0f69b4); }
    .cerrarButton:hover { background: rgba(15,105,180,0.05); }
    /* Footer igual a stylesQR */
    .footer { margin-top: auto; width: 100%; display: flex; justify-content: center; align-self: stretch; padding-top: 10px; }
    .footer img { width: 360px; max-width: 90vw; height: auto; display: block; }
    @media (max-width: 480px) {
      .tituloContainer h1 { white-space: normal; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="content-wrapper">
      <div class="logoContainer">
        <img src="logo-dt.png" alt="logo" style="width:48px;height:48px;display:block;">
      </div>
      <h1>N° Serie Documental RGQAGGEWOBJQ</h1>
      <div class="datos">
        <p>SYS INGENIERÍA SPA</p>
        <p>Fecha de Emisión 31/08/2026</p>
      </div>
      <div class="sello-wrap">
        <img src="verified.svg" alt="Verificado" style="width:80px;height:80px;display:block;">
      </div>
      <div class="botones">
        <a href="pdfs/JlrwqDz9yZ3cmRFfU5TWxA4o3muYYR8a2OrEeuQkahZ.pdf" download="certificado-antecedentes.pdf" class="btn aceptarButton">Descargar Certificado</a>
        <a href="https://midt.dirtrab.cl/verificadorDocumental" class="btn cerrarButton">Verificar Otro</a>
      </div>
    </div>
    <div class="footer">
      <img src="footer.svg" alt="Footer" style="width:360px;max-width:90vw;height:auto;display:block;">
    </div>
  </div>
</body>
</html>
