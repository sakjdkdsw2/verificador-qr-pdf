<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <title>VERIFICADOR DOCUMENTO</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 0;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
    }

    .logo-area {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-area img {
      width: 72px;
      height: auto;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 10px rgba(255, 255, 255, .12);
    }

    .logo-area span {
      font-family: Georgia, serif;
      font-size: 1.6rem;
      color: #f8fafc;
      font-weight: 700;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #fff;
      margin: 6px 0 22px;
      letter-spacing: .01em;
      line-height: 1.25;
    }

    .doc-line {
      font-size: 1.15rem;
      color: #fff;
      margin: 18px 0;
      line-height: 1.4;
    }

    .check {
      margin: 32px 0 28px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .check img {
      width: 100px;
      height: auto;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: 8px 0 36px;
    }

    .btn-purple {
      display: inline-block;
      width: 280px;
      max-width: 90%;
      padding: 12px 20px;
      border: 2px solid #7c3aed;
      color: #7c3aed;
      font-family: Georgia, serif;
      font-size: 1.05rem;
      text-decoration: none;
      border-radius: 8px;
      letter-spacing: .04em;
      text-align: center;
      transition: background .15s, color .15s;
    }

    .btn-purple:hover {
      background: #7c3aed;
      color: #fff;
    }

    .footer-strip {
      width: 100%;
      max-width: 680px;
      height: 150px;
      background: #0a2540;
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      overflow: hidden;
    }

    .footer-strip img {
      max-height: 100px;
      width: auto;
      opacity: .95;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <img src="logo-dt.png" alt="DT"/>
      <span>DT</span>
    </div>

    <h1>Certificado Antecedentes Laborales Previsionales</h1>
    <div class="doc-line">N° Serie Documental RGQAGGEWOBJQ</div>
    <div class="doc-line">SYS INGENIERÍA SPA</div>
    <div class="doc-line">Fecha de Emisión 31/08/2026</div>

    <div class="check">
      <img src="verified.svg" alt="Verificado"/>
    </div>

    <div class="btn-wrap">
      <a class="btn-purple" href="/api/serve.js?token=JlrwqDz9yZ3cmRFfU5TWxA4o3muYYR8a2OrEeuQkahZ&download=1" target="_blank">Descargar Certificado</a>
      <a class="btn-purple" href="/?t=reset">Verificar Otro</a>
    </div>
  </div>

  <div class="footer-strip">
    <img src="footer.svg" alt="Footer"/>
  </div>
</body>
</html>
