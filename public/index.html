<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#000000"/>
<title>VERIFICADOR DOCUMENTO</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
<style>
:root{--bg:#0b1222;--card:#111827;--green:#22c55e;--text:#e2e8f0;}
*{box-sizing:border-box;}html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.container{max-width:640px;width:100%;background:var(--card);border-radius:18px;padding:32px 24px;border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center;}
h1{font-size:1.6rem;font-weight:800;color:#fff;margin:0 0 14px;letter-spacing:-.02em;}
.subtitle{color:#94a3b8;font-size:.92rem;margin:0 0 22px;}
.logo-area{margin:10px 0 16px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.logo-area img{width:72px;height:auto;border-radius:50%;box-shadow:0 6px 22px rgba(0,0,0,.35);background:#fff;}
.check-badge{display:inline-flex;align-items:center;gap:8px;background:#22c55e;color:#fff;font-weight:700;padding:6px 12px;border-radius:999px;font-size:.85rem;box-shadow:0 4px 14px rgba(34,197,94,.35);}
.check-badge img{width:22px;height:22px;}
.doc-block{text-align:left;background:#0b1222;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:16px 20px;margin:14px 0 18px;}
.doc-block p{margin:6px 0;font-size:.88rem;line-height:1.45;color:#e2e8f0;}
.doc-block strong{display:inline-block;min-width:120px;color:#fff;font-weight:600;}
.footer-img{display:block;max-width:220px;margin:16px auto 6px;opacity:.95;border-radius:6px;}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.btn{display:inline-block;padding:14px 26px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;text-decoration:none;transition:.15s;color:#fff;}
.btn-green{background:#22c55e;}
.btn-green:hover{background:#16a34a;}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.15);color:#e2e8f0;}
.btn-ghost:hover{background:rgba(255,255,255,.06);}
.favicon-ref{text-align:center;margin-top:18px;font-size:.72rem;color:#64748b;}
</style>
</head>
<body>
<div class="container">
  <h1>VERIFICADOR DOCUMENTO</h1>
  <p class="subtitle">Documento verificado — Certificado Antecedentes Laborales Previsionales</p>

  <div class="logo-area">
    <img src="logo-dt.png" alt="Logo DT" style="max-width:72px;" />
    <div class="check-badge"><img src="verified.svg" alt="Verificado" /> VISTO BUENO</div>
  </div>

  <div class="doc-block">
    <p><strong>N° Serie Documental:</strong> RGQAGGEWOBJQ</p>
    <p><strong>SYS INGENIERÍA SPA</strong></p>
    <p><strong>Fecha de Emisión:</strong> 31/08/2026</p>
  </div>

  <img class="footer-img" src="footer.svg" alt="Footer documento" />

  <div class="actions">
    <a class="btn btn-green" id="btnDownload" href="/api/serve.js?token=JlrwqDz9yZ3cmRFfU5TWxA4o3muYYR8a2OrEeuQkahZ&amp;download=1" target="_blank" rel="noopener">Descargar Certificado</a>
    <a class="btn btn-ghost" id="btnVerify" href="/">Verificar Otro</a>
  </div>
  <p class="favicon-ref">Referencia: icono del dominio original · Certificado validado</p>
</div>
</body>
</html>
