<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <title>VERIFICADOR DOCUMENTO</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: "Times New Roman", serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 0;
    }

    .modalContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      align-self: stretch;
      padding: 8px 0;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      color: #000;
      text-align: left;
    }

    .row {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 518.237px;
      height: 774.400px;
    }

    .dt-logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: block;
      object-fit: contain;
      border-radius: 50%;
    }

    .terminosContainer {
      align-items: flex-start;
      display: flex;
      flex-direction: column;
      font-family: "Times New Roman", serif;
      font-size: 20px;
      gap: 24px;
      margin-left: 35px;
      padding: 16px;
    }

    .aceptarButton, .cerrarButton {
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      outline: none;
      position: relative;
      font-weight: 400;
      white-space: nowrap;
      text-align: center;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);
      user-select: none;
      touch-action: manipulation;
      box-shadow: 0 2px 0 rgba(0,0,0,0.02);
      border-color: #d9d9d9;
      align-items: center;
      border-radius: 4px;
      display: flex;
      font-family: Roboto;
      font-size: 16px;
      gap: 8px;
      height: 43px;
      justify-content: center;
      min-height: 42px;
      min-width: 256px;
      padding: 8px 20px;
      background: var(--primary-00,#0f69b4);
      color: #fff;
    }

    h1 {
      font-family: "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
      margin-left: 30px;
    }

    .logoContainer {
      margin: 32px 0 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .logoContainer img {
      width: 100px;
      height: auto;
      display: block;
    }

    /* Logo DT (arriba izquierda) */
    .logo-dt-container {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      width: 100%;
      margin: 16px 0 12px;
      padding: 0;
    }

    .logo-dt-container img {
      width: 60px;
      height: 60px;
      display: block;
      object-fit: contain;
    }

    .dt-logo {
      width: 60px;
      height: 60px;
      display: block;
      object-fit: contain;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin: 8px 0 36px;
    }

    .footerContainer {
      width: 100%;
      max-width: 680px;
      margin-top: auto;
    }

    .footerContainer .row {
      height: 150px;
      background: #0a2540;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .footerContainer .row img {
      width: 380px;
      max-width: 100%;
      height: auto;
      opacity: .95;
    }
  </style>
</head>
<body>  <div class="modalContainer container">
    <div class="row" style="width:518.237px;height:774.400px;flex-direction:column;align-items:center;">
      <img src="logo-dt.png" alt="logo-modal" class="dt-logo" style="width:36px;height:36px;object-fit:contain;display:block;margin-bottom:8px;">
      <div class="terminosContainer" style="margin-left:0;padding:6px;text-align:center;">
        <h1>Certificado Antecedentes Laborales Previsionales</h1>
        <div>N° Serie Documental RGQAGGEWOBJQ</div>
        <div>SYS INGENIERÍA SPA</div>
        <div><strong>Fecha de Emisión 31/08/2026</strong></div>
      </div>
      <div class="logoContainer"><img src="verified.svg" alt="Verificado" width="120"></div>
      <div class="btn-wrap">
        <button type="button" class="ant-btn aceptarButton"><span>Descargar Certificado</span></button>
        <button type="button" class="ant-btn cerrarButton"><span>Verificar Otro</span></button>
      </div>
      <div class="footerContainer"><img src="footer.svg" alt="Footer"></div>
    </div>
  </div></body>
</html>
