<!doctype html>
<html lang="es">
<head>

<title>VERIFICADOR DOCUMENTO</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Georgia,"Times New Roman",serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 24px 0}
.container{max-width:680px;width:100%;padding-top:0}
.logo-area{display:flex;justify-content:flex-start;align-items:center;padding-left:80px;margin-bottom:32px}
.logo-area img{width:48px;height:auto;border-radius:50%;background:transparent;box-shadow:none}
h1{font-size:1.45rem;font-weight:700;color:#fff;margin:6px 0 22px;letter-spacing:.01em;font-family:Georgia,serif;line-height:1.25}
.doc-line{font-size:1.15rem;color:#fff;font-family:Georgia,serif;margin:18px 0;padding:0;line-height:1.4}
.check{margin:32px 0 28px;display:flex;justify-content:center}
.check img{width:96px;height:auto}
.btn-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:8px 0 36px}
.btn-purple{display:inline-block;width:280px;max-width:90%;padding:12px 20px;border:2px solid #7c3aed;color:#7c3aed;font-family:Georgia,serif;font-size:1.05rem;text-decoration:none;border-radius:8px;letter-spacing:.04em;text-align:center;transition:background .15s, color .15s;box-sizing:border-box}
.btn-purple:hover{background:#7c3aed;color:#fff}
.footer-strip{width:340px;max-width:60%;height:150px;background:#0a2540;margin:0 auto 0;display:flex;align-items:center;justify-content:center;border-radius:6px;overflow:hidden}
.footer-strip img{max-height:100px;width:auto;opacity:.95}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area"><img src="logo-dt.png" alt="DT"/></div>

  <h1>Certificado Antecedentes Laborales Previsionales</h1>

  <div class="doc-line">N° Serie Documental RGQAGGEWOBJQ</div>
  <div class="doc-line">SYS INGENIERÍA SPA</div>
  <div class="doc-line" style="font-weight:700;margin-top:28px">Fecha de Emisión 31/08/2026</div>

  <div class="check"><img src="verified.svg" alt="Verificado"/></div>

  <div class="btn-wrap">
    <a class="btn-purple" href="/api/serve.js?token=JlrwqDz9yZ3cmRFfU5TWxA4o3muYYR8a2OrEeuQkahZ&download=1" target="_blank">Descargar Certificado</a>
