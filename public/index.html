<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificación Documental — SYS Ingeniería SpA</title>
<style>
  :root{
    --azul:#1668b3;
    --verde:#5cb85c;
    --texto:#000;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#fff;
    color:var(--texto);
    font-family:"Times New Roman", Times, Georgia, serif;
    min-height:100vh;
  }
  .hoja{
    max-width:780px;
    margin:0 auto;
    padding:24px 20px 60px;
  }
  .logo{
    width:56px;
    height:56px;
    border:4px solid #000;
    border-radius:50%;
    margin:4px 0 0 40px;
    display:block;
  }
  .logo img{
    width:36px; height:36px; display:block; object-fit:contain;
  }
  .contenido{
    margin-top:80px;
    padding-left:60px;
  }
  .dato{
    font-size:19px;
    line-height:1.5;
    margin:0 0 26px;
  }
  .dato.negrita{font-weight:700}

  .centro{
    text-align:center;
    padding-right:60px;
  }

  .sello{
    width:120px;
    height:120px;
    margin:22px auto 40px;
    display:block;
  }
  .boton{
    display:block;
    width:287px;
    height:44px;
    margin:0 auto 36px;
    background:var(--azul);
    border:none;
    border-radius:3px;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    font-size:15px;
    cursor:pointer;
  }
  .boton:hover{background:#12578f}
  .campo{
    display:block;
    width:287px;
    height:44px;
    margin:0 auto;
    padding:0 10px;
    border:1px solid var(--azul);
    border-radius:3px;
    background:#fff;
    font-family:Arial, Helvetica, sans-serif;
    font-size:15px;
    outline:none;
  }
  .campo:focus{box-shadow:0 0 0 2px rgba(22,104,179,.25)}
  @media (max-width:640px){
    .contenido{padding-left:0;margin-top:40px}
    .centro{padding-right:0}
    .logo{margin-left:0}
    .boton,.campo{width:100%;max-width:287px}
  }
</style>
</head>
<body>
<div class="hoja">
  <div class="logo"><img src="logo-dt.png" alt="logo-modal"></div>
  <div class="contenido">
    <p class="dato">N° Serie Documental RGQAGGEWOBJQ</p>
    <p class="dato">SYS INGENIERÍA SPA</p>
    <p class="dato negrita">Fecha de Emisión 31/08/2026</p>
    <div class="centro">
      <img class="sello" src="verified.svg" alt="Verificado" width="120">
      <button class="boton" type="button">Descargar Certificado</button>
      <div style="margin-top:8px;color:#555;font-size:13px;">Verificar con código</div>
    </div>
  </div>
</div>
</body>
</html>
