<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERIFICADOR DOCUMENTO</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      background: #fff;
      /* Fuente exacta del CSS original de la DT */
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
    }

    .content {
      width: 100%;
      max-width: 520px;
      padding: 0 16px;
    }

    .logo-wrap {
      margin-bottom: 16px;
      margin-left: -40px;   /* un poco más a la izquierda */
    }
    .logo-wrap img {
      width: 48px;
      height: 48px;
      display: block;
    }

    /* TÍTULO - igual que original */
    .titulo {
      text-align: center;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 34px 0;
      line-height: 1.35;
      white-space: nowrap;
      color: #000;
      letter-spacing: -0.01em;
    }

    /* DATOS - font-size 16px como referencia real */
    .datos {
      text-align: left;
      margin-bottom: 36px;
    }
    .datos p {
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      margin: 0 0 18px 0;
      line-height: 1.5;
      text-align: left;
      color: #000;
      letter-spacing: 0.01em;
    }
    .datos p:last-child {
      margin-bottom: 0;
    }

    /* SYS INGENIERÍA SPA - sin negrita */
    .datos .empresa {
      font-weight: 400;
    }

    /* Fecha de Emisión - con negrita */
    .datos .fecha {
      font-weight: 700;
    }

    .sello-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
    }
    .sello-wrap svg {
      width: 80px;
      height: 80px;
    }

    .botones {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;   /* 14px como referencia visual real (captura browser_vision muestra espacio menor entre botones) */
      margin-bottom: 40px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 256px;
      height: 40px;
      border-radius: 4px;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 400;
      padding: 8px 20px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-azul {
      background: #0f69b4;
      color: #fff;
      border: none;
    }
    .btn-azul:hover { background: #0d5c9e; }
    .btn-borde {
      background: transparent;
      color: #0f69b4;
      border: 1px solid #0f69b4;
    }
    .btn-borde:hover { background: rgba(15,105,180,0.05); }

    .footer {
      margin-top: auto;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .footer svg {
      width: 360px;
      max-width: 90vw;
      height: auto;
      display: block;
    }

    @media (max-width: 480px) {
      .titulo {
        white-space: normal;
        font-size: 16px;
      }
    }
  </style>
</head>
